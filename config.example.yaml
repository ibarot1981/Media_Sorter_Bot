telegram_bot_token: "PUT_TOKEN_HERE"

server:
  server_id: "work_server_01"
  server_name: "Work Office PC"

security:
  allowed_telegram_user_ids:
    - 123456789
    - 987654321

paths:
  base_storage_path: "D:/Product Media"
  incoming_temp_path: "D:/Product Media/_incoming_temp"
  database_path: "data/media_sorter.db"
  syncthing_inbox_path: "D:/Product Media/_syncthing_inbox"
  syncthing_processed_path: "D:/Product Media/_syncthing_processed"
  review_thumbnail_path: "data/review-thumbnails"

behavior:
  delete_telegram_message_after_save: true
  duplicate_action: "skip"
  allow_new_folder: true
  keep_original_filename: true

folder_config:
  categories_file: "categories.example.yaml"

logging:
  level: "INFO"
  file: "logs/media_sorter.log"

webui:
  host: "127.0.0.1"
  port: 8080

review_queue:
  enabled: false
  poll_interval_seconds: 15
  stable_file_age_seconds: 30
  notification_batch_minutes: 5
  batch_size_default: 15
  review_base_url: "http://192.168.1.50:8080"
  link_secret: ""
  delete_inbox_file_after_save: true
  generate_image_thumbnails: true
  generate_video_thumbnails: true
  generate_pdf_previews: true

local_bot_api:
  enabled: false
  auto_start: true
  base_url: "http://127.0.0.1:8081/bot"
  base_file_url: "http://127.0.0.1:8081/file/bot"
  http_host: "127.0.0.1"
  http_port: 8081
  binary_path: "telegram-bot-api.exe"
  working_dir: "data/telegram-bot-api"
  temp_dir: "data/telegram-bot-api/tmp"
  log_file: "logs/telegram-bot-api.log"
